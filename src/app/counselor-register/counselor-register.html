<div class="register-container">

  <div class="register-card">

    <h1>
  Counselor <span>Registration</span>
</h1>
    <p>Add new counselor to CollegeRoute CRM</p>

    <div class="form-grid">

  <div class="form-group">
    <label>👤 Full Name</label>
    <input class="form-control" type="text" placeholder="Enter full name" [(ngModel)]="counselor.name" name="name">
  </div>

  <div class="form-group">
    <label>📞 Mobile Number</label>
    <input class="form-control" type="text" placeholder="Enter mobile number" [(ngModel)]="counselor.mobile" name="mobile">
  </div>

  <div class="form-group">
    <label>📧 Email Address</label>
    <input class="form-control" type="email" placeholder="Enter email" [(ngModel)]="counselor.email" name="email">
  </div>

  <div class="form-group">
    <label>🔒 Password</label>
    <input class="form-control" type="password" placeholder="Enter password" [(ngModel)]="counselor.password" name="password">
  </div>

  <div class="form-group">
    <label>🏢 Department</label>
    <select class="form-control" [(ngModel)]="counselor.department" name="department">
      <option value="">Select department</option>
      <option>Engineering</option>
      <option>Medical</option>
      <option>Management</option>
      <option>Nursing</option>
      <option>Abroad Study</option>
    </select>
  </div>

  <div class="form-group">
    <label>🛡 Role</label>
    <select class="form-control" [(ngModel)]="counselor.role" name="role">
      <option value="">Select role</option>
      <option>Counselor</option>
      <option>Senior Counselor</option>
      <option>Telecaller</option>
    </select>
  </div>

</div>
<p class="error-message" *ngIf="errorMessage">
  {{ errorMessage }}
</p>
    <button class="register-btn" (click)="registerCounselor()">
  Register Counselor
</button>

  </div>

  <div class="success-popup" *ngIf="showSuccess">

  <div class="success-card">
    <h2>🎉 Congratulations!</h2>
    <p>Counselor has been registered successfully.</p>

    <button (click)="showSuccess = false">
      Continue
    </button>
  </div>

</div>
